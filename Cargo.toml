[package]
name = "hitit"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Desktop app for MusicIndex music feeds, a local audio library and live value broadcasts"

[dependencies]
toml  = "1.0"
rusqlite = { version = "0.38", features = ["bundled", "backup", "hooks"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
rss = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde_json = "1"
# ADR 0091 step 1: the search parser, the Index plan and the kind rule.
musicindex-search = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "47611480a59ca72b57d00b02a94ef709e4ee66f5" }
# musicindex ADR 0083 R-VERSION-8: share build values and version formatting.
musicindex-build-info = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "e6d11118d33069c26c01368f7de71524988039c6" }
# musicindex ADR 0075 R-VALUE-4: the share percentages and the short address
# (musicindex ADR 0076 R-ADDRESS-2) come from the shared crate.
musicindex-value = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "5e35cf5c39a8ff68c64267156d0a7165c43f1826" }
# musicindex ADR 0086 R-TAG-1 and ADR 0089 R-TAG-6: the frame code of song and
# episode files comes from the shared crate.
musicindex-tags = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "2226fafbb2ea21ca7116038764641dcaffe1eb8d" }
roxmltree = "=0.21.1"
quick-xml = { version = "=0.37.5", features = ["encoding"] }
# ADR 0076 packet 002: readable-text comparison of descriptions (ADR 0075
# comparison contract, version 1) needs a standards-based HTML parser. Both
# crates are already in the lock file through gpui-component.
html5ever = "=0.27.0"
markup5ever_rcdom = "=0.3.0"

# config parsing
serde = { version = "1", features = ["derive"] }
directories = "6"

# nice error handling
anyhow = "1"

# GPUI desktop UI
gpui = { package = "gpui-pre", version = "=0.3.1" }
gpui-component = "=0.6.1"
gpui-base = "=0.6.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.1", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-kit-assets = "=0.6.1"
open = "5"

# media cache
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
sha2 = "0.10"
base64 = "=0.22.1"
encoding_rs = "=0.8.35"
mime = "=0.3.17"
lru = "0.12"

# musicindex ADR 0053 R-LIST-12: text order of the language of the reader.
icu_collator = "~2.1"
icu_datetime = "~2.1"
icu_locale_core = "~2.1"
sys-locale = "0.3"

# Async view-model runtime (ADR 0040).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

# ADR 0101 Decision 11: the system accessibility settings come from the
# xdg-desktop-portal Settings interface. GPUI already builds this crate with
# the async-io runtime of zbus. The features here add no second runtime.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "settings"] }

[build-dependencies]
# musicindex ADR 0083 R-VERSION-8: emit the shared build values.
musicindex-build-info = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "e6d11118d33069c26c01368f7de71524988039c6" }

[dev-dependencies]
# The tests build MP3 tag fixtures. The production frame code is in
# musicindex-tags (musicindex ADR 0086 R-TAG-1).
id3 = "1.17"
gpui = { package = "gpui-pre", version = "=0.3.1", features = ["test-support"] }
# ADR 0097 Decision 3: the fit tests measure text with Figtree.
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.1" }
tempfile = "3"
# ADR 0083 task 002 proves the embedded Figtree files' family name directly.
# The gpui test text system is a no-op. It cannot resolve a family name.
ttf-parser = "0.25"
# ADR 0059 task 018: the service watch pace tests pause and advance tokio
# time. The production binary does not get this feature.
tokio = { version = "1", features = ["test-util"] }

# ADR 0072: final-glyph hit testing and complete grapheme word selection only.
# ADR 0097 Decision 3: the same rev also patches gpui-pre, so a test context
# can take a platform text system.
[patch.crates-io]
gpui-base = { git = "https://github.com/InTheMorning/gpui-kit", rev = "9e2392bcc57de0e6dc782901447d86e41483cded" }
gpui-pre = { git = "https://github.com/InTheMorning/gpui-kit", rev = "9e2392bcc57de0e6dc782901447d86e41483cded" }

[[bin]]
name = "hitit"
path = "src/main.rs"

# ADR 0066 task 003: font parsing/shaping stalls debug Settings layout.
# Optimize the text stack, including its generic callers. Keep the app itself
# unoptimized with debug assertions and symbols for operator recovery fixtures.
[profile.dev.package.ttf-parser]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.cosmic-text]
opt-level = 3

# ADR 0071: the native resize CPU capture identifies repeated layout work.
# Taffy's generic layout algorithms are instantiated by GPUI; optimize both
# dependencies while keeping application debugging and dependency pins intact.
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

# gpui-pre-macros 0.3.1 compiles its inspector module only with debug
# assertions or the `inspector` feature, but one helper always calls it.
# A release build turns debug assertions off, and the crate does not compile.
# Proc macros use this profile, so this setting keeps the module. The release
# binary itself stays optimized and has no debug assertions.
[profile.release.build-override]
debug-assertions = true

# ADR 0103 Decisions 2 and 6. A new run-time library or external program
# changes this table and the PKGBUILD.
[package.metadata.deb]
maintainer = "HeyCitizen <4637290+InTheMorning@users.noreply.github.com>"
extended-description = "HitIt finds music in MusicIndex, downloads it to a local library and controls live value broadcasts. mpv, flac, ffmpeg, ssh and butt are optional programs from the distribution."
depends = "$auto, libvulkan1, libegl1, libwayland-client0, libwayland-egl1, fontconfig, ca-certificates"
recommends = "mpv, flac, ffmpeg, openssh-client, butt"
suggests = "musicindex-live-publisher"
section = "sound"
priority = "optional"
assets = [
    ["target/release/hitit", "usr/bin/hitit", "755"],
    ["packaging/arch/hitit.desktop", "usr/share/applications/hitit.desktop", "644"],
    ["src/assets/music_network_logo.png", "usr/share/icons/hicolor/512x512/apps/hitit.png", "644"],
    ["README.md", "usr/share/doc/hitit/README.md", "644"],
    ["LICENSE", "usr/share/doc/hitit/copyright", "644"],
]
